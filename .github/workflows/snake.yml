name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: borjamoskv
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=0xCCFF00&color_dots=#0A0A0A,#1a1a1a,#333333,#666666,#CCFF00
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
