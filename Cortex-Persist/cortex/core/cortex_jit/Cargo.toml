[package]
name = "cortex_jit"
version = "0.1.0"
edition = "2021"

[lib]
name = "cortex_jit"
crate-type = ["cdylib"]

[dependencies]
memmap2 = "0.9.10"
rayon = "1.8"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
serde_json = "1.0"
sha2 = "0.11.0"
tokio = { version = "1.28", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
