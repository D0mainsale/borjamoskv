<svg width="800" height="20" viewBox="0 0 800 20" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .glow-mag { filter: drop-shadow(0 0 3px #FF0055); }
      .glow-cyan { filter: drop-shadow(0 0 3px #00F0FF); }
      .text-micro { font-family: monospace; font-size: 10px; font-weight: bold; fill: #FAFAFA; opacity: 0.7;}
    </style>
  </defs>

  <!-- Left Side: Cyan -->
  <rect x="0" y="9" width="350" height="2" fill="#00F0FF" opacity="0.4" />
  <rect x="0" y="9" width="50" height="2" fill="#00F0FF" class="glow-cyan">
    <animate attributeName="x" values="0;300" dur="1.5s" repeatCount="indefinite" />
  </rect>

  <text x="360" y="13" class="text-micro">[ SYSTEM_LINK ]</text>

  <!-- Right Side: Magenta -->
  <rect x="460" y="9" width="340" height="2" fill="#FF0055" opacity="0.4" />
  <rect x="460" y="9" width="50" height="2" fill="#FF0055" class="glow-mag">
    <animate attributeName="x" values="750;460" dur="1.5s" repeatCount="indefinite" />
  </rect>
</svg>
