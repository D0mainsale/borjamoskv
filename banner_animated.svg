<svg width="800" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #080808; }
      .text-hero { font-family: monospace; font-size: 58px; font-weight: bold; letter-spacing: -2px; }
      .text-sub { font-family: monospace; font-size: 14px; font-weight: bold; fill: #CCFF00; letter-spacing: 2px; }
      .text-micro { font-family: monospace; font-size: 10px; fill: #FAFAFA; opacity: 0.6; }
      .glow { filter: drop-shadow(0 0 5px #CCFF00); }
      .glow-cyan { filter: drop-shadow(0 0 5px #00F0FF); }
      .glow-mag { filter: drop-shadow(0 0 5px #FF0055); }
      
      .st-cyan { fill: #00F0FF; }
      .st-mag { fill: #FF0055; }
      .st-neon { fill: #CCFF00; }
      .st-white { fill: #FAFAFA; }
      
      .grid-line { stroke: #2B3BE5; stroke-width: 0.5; opacity: 0.3; }
      
      @keyframes rgb-glitch-1 {
        0%, 100% { transform: translate(0, 0); opacity: 1; }
        10% { transform: translate(-3px, -2px); opacity: 0.8; }
        20% { transform: translate(3px, 2px); opacity: 0.9; }
        30% { transform: translate(-3px, 0); opacity: 1; }
      }
      @keyframes rgb-glitch-2 {
        0%, 100% { transform: translate(0, 0); opacity: 1; }
        12% { transform: translate(3px, 2px); opacity: 0.8; }
        22% { transform: translate(-3px, -2px); opacity: 0.9; }
        32% { transform: translate(3px, 0); opacity: 1; }
      }
      .rgb-c { animation: rgb-glitch-1 3.5s infinite; mix-blend-mode: screen; }
      .rgb-m { animation: rgb-glitch-2 3.2s infinite; mix-blend-mode: screen; }
      
    </style>
    
    <pattern id="iso-grid" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="scale(1, 0.5) rotate(45)">
      <path d="M 40 0 L 0 0 0 40" fill="none" class="grid-line" />
    </pattern>
    <linearGradient id="fade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#080808" stop-opacity="1" />
      <stop offset="100%" stop-color="#2B3BE5" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Base Black -->
  <rect width="800" height="250" class="bg" />

  <!-- Isometric Techno Floor -->
  <g transform="translate(0, 100)">
    <!-- The grid moving downwards -->
    <rect x="-800" y="-800" width="2400" height="2400" fill="url(#iso-grid)">
      <animate attributeName="y" values="-800;-760" dur="2s" repeatCount="indefinite" />
    </rect>
    <!-- Fade mask to hide the top horizon of the grid -->
    <rect x="0" y="-100" width="800" height="150" fill="url(#fade)" />
  </g>

  <!-- Left Side: Chromatic Hero Title -->
  <g transform="translate(40, 90)">
    <!-- Magenta Base -->
    <text x="-2" y="0" class="text-hero st-mag rgb-m glow-mag">BORJAMOSKV</text>
    <!-- Cyan Base -->
    <text x="2" y="0" class="text-hero st-cyan rgb-c glow-cyan">BORJAMOSKV</text>
    <!-- White Top -->
    <text x="0" y="0" class="text-hero st-white">
       <animate attributeName="opacity" values="1;0.9;1;0.4;1" dur="4s" repeatCount="indefinite" />
       BORJAMOSKV
    </text>
    
    <text x="5" y="35" class="text-sub glow">CORTEX // SOVEREIGN_NODE</text>
    <text x="5" y="55" class="text-micro">PROTOCOL_V3: CHROMATIC + ISOMETRIC AESTHETIC</text>
    <text x="5" y="70" class="text-micro">EST. 2026 // BILBAO</text>
    <rect x="5" y="85" width="200" height="1" fill="#FAFAFA" opacity="0.3" />
  </g>

  <!-- Center-Right: "Audio" Spectrum Visualizer -->
  <g transform="translate(380, 150)">
    <text x="0" y="-35" class="text-micro" fill="#CCFF00">>> AUDIO_BUFFER [ON]</text>
    <g transform="translate(0, 10)">
      <!-- 15 bars acting as graphic equalizer -->
      <rect x="0" y="0" width="6" height="20" fill="#CCFF00" class="glow">
        <animate attributeName="y" values="0;-40;0" dur="0.4s" repeatCount="indefinite" />
        <animate attributeName="height" values="20;60;20" dur="0.4s" repeatCount="indefinite" />
      </rect>
      <rect x="10" y="0" width="6" height="20" fill="#00F0FF" class="glow-cyan">
        <animate attributeName="y" values="0;-25;0" dur="0.3s" repeatCount="indefinite" />
        <animate attributeName="height" values="20;45;20" dur="0.3s" repeatCount="indefinite" />
      </rect>
      <rect x="20" y="0" width="6" height="20" fill="#FF0055" class="glow-mag">
        <animate attributeName="y" values="0;-50;0" dur="0.5s" repeatCount="indefinite" />
        <animate attributeName="height" values="20;70;20" dur="0.5s" repeatCount="indefinite" />
      </rect>
      <rect x="30" y="0" width="6" height="20" fill="#CCFF00" class="glow">
        <animate attributeName="y" values="0;-15;0" dur="0.25s" repeatCount="indefinite" />
        <animate attributeName="height" values="20;35;20" dur="0.25s" repeatCount="indefinite" />
      </rect>
      <rect x="40" y="0" width="6" height="20" fill="#00F0FF" class="glow-cyan">
        <animate attributeName="y" values="0;-55;0" dur="0.6s" repeatCount="indefinite" />
        <animate attributeName="height" values="20;75;20" dur="0.6s" repeatCount="indefinite" />
      </rect>
      <rect x="50" y="0" width="6" height="20" fill="#FAFAFA">
        <animate attributeName="y" values="0;-35;0" dur="0.45s" repeatCount="indefinite" />
        <animate attributeName="height" values="20;55;20" dur="0.45s" repeatCount="indefinite" />
      </rect>
      <rect x="60" y="0" width="6" height="20" fill="#FF0055" class="glow-mag">
        <animate attributeName="y" values="0;-45;0" dur="0.5s" repeatCount="indefinite" />
        <animate attributeName="height" values="20;65;20" dur="0.5s" repeatCount="indefinite" />
      </rect>
      <rect x="70" y="0" width="6" height="20" fill="#CCFF00" class="glow">
        <animate attributeName="y" values="0;-20;0" dur="0.35s" repeatCount="indefinite" />
        <animate attributeName="height" values="20;40;20" dur="0.35s" repeatCount="indefinite" />
      </rect>
      <rect x="80" y="0" width="6" height="20" fill="#00F0FF" class="glow-cyan">
        <animate attributeName="y" values="0;-60;0" dur="0.65s" repeatCount="indefinite" />
        <animate attributeName="height" values="20;80;20" dur="0.65s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- Far Right: Astrolabe / Data Core -->
  <g transform="translate(680, 110)">
    <!-- Central Node -->
    <circle cx="0" cy="0" r="10" fill="#FAFAFA" class="glow">
       <animate attributeName="r" values="8;12;8" dur="1s" repeatCount="indefinite" />
    </circle>
    <!-- Complex Counter-rotating rings -->
    <circle cx="0" cy="0" r="40" stroke="#CCFF00" stroke-width="2" fill="none" stroke-dasharray="10 50">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="60" stroke="#00F0FF" stroke-width="1.5" fill="none" stroke-dasharray="20 10 5 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="80" stroke="#FF0055" stroke-width="1" fill="none" stroke-dasharray="1 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite" />
    </circle>
    
    <!-- Radar Line -->
    <line x1="0" y1="0" x2="80" y2="0" stroke="#CCFF00" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Decorative Border & Scanning Sweep -->
  <rect x="0" y="0" width="800" height="250" fill="none" stroke="#2B3BE5" stroke-width="4" opacity="0.3"/>
  <line x1="0" y1="0" x2="800" y2="0" stroke="#CCFF00" stroke-width="4" class="glow">
    <animate attributeName="y1" values="0;250;0" dur="6s" repeatCount="indefinite" />
    <animate attributeName="y2" values="0;250;0" dur="6s" repeatCount="indefinite" />
  </line>
</svg>
