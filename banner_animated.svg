<svg width="800" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0A0A0A; }
      .grid-line { stroke: #2B3BE5; stroke-width: 0.5; opacity: 0.3; }
      .text-hero { font-family: 'Courier New', Courier, monospace; font-size: 56px; font-weight: bold; fill: #FAFAFA; letter-spacing: -2px; }
      .text-neon { font-family: 'Courier New', Courier, monospace; font-size: 14px; font-weight: bold; fill: #CCFF00; letter-spacing: 2px; }
      .text-micro { font-family: 'Courier New', Courier, monospace; font-size: 10px; fill: #FAFAFA; opacity: 0.5; }
      .glow { filter: drop-shadow(0 0 5px #CCFF00); }
      .neon-stroke { stroke: #CCFF00; stroke-width: 1.5; fill: none; }
    </style>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" class="grid-line" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="250" class="bg" />
  <rect x="350" y="0" width="450" height="250" fill="url(#grid)">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Left Side: Typography & Core Info -->
  <g transform="translate(30, 80)">
    <!-- Glitching Title -->
    <text x="0" y="0" class="text-hero">
      <tspan>BORJAMOSKV</tspan>
      <animate attributeName="opacity" values="1;0.8;1;0.3;1" dur="3s" repeatCount="indefinite" />
      <animate attributeName="x" values="0;2;-2;0" dur="3s" repeatCount="indefinite" />
    </text>
    
    <text x="5" y="30" class="text-neon glow">CORTEX // SOVEREIGN_NODE</text>
    
    <!-- Animated Status Block -->
    <rect x="5" y="47" width="8" height="8" fill="#CCFF00" class="glow">
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
    </rect>
    <text x="25" y="55" class="text-micro">UPTIME: 99.99% // SECURED</text>
    
    <text x="5" y="75" class="text-micro">EST. 2026</text>
    <text x="5" y="90" class="text-micro">LOC: BILBAO, BQ</text>
    <text x="5" y="105" class="text-micro">AESTHETIC: INDUSTRIAL_NOIR</text>
  </g>

  <!-- Right Side: Rotating Reactor Core -->
  <g transform="translate(600, 125)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="80" stroke="#2B3BE5" stroke-width="1" fill="none" stroke-dasharray="4 4" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
    </circle>
    
    <!-- Mid Ring -->
    <circle cx="0" cy="0" r="60" class="neon-stroke" stroke-dasharray="10 30 50 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="10s" repeatCount="indefinite" />
    </circle>

    <!-- Inner Core -->
    <circle cx="0" cy="0" r="30" stroke="#FAFAFA" stroke-width="2" fill="none" opacity="0.2" />
    <circle cx="0" cy="0" r="8" fill="#CCFF00" class="glow">
      <animate attributeName="r" values="4;10;4" dur="2s" repeatCount="indefinite" />
    </circle>
    
    <!-- Crosshairs -->
    <path d="M -90 0 L 90 0 M 0 -90 L 0 90" stroke="#2B3BE5" stroke-width="0.5" opacity="0.5" />
    
    <!-- Orbiting Nodes -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite" />
      <circle cx="60" cy="0" r="3" fill="#FAFAFA" />
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180" to="-180" dur="5s" repeatCount="indefinite" />
      <circle cx="80" cy="0" r="2" fill="#CCFF00" class="glow" />
    </g>
  </g>

  <!-- Hex Dump Data River -->
  <g transform="translate(380, 50)" class="text-micro">
    <text y="0">
      <tspan x="0">0x4F 0x9A 0x11 0x00</tspan>
      <tspan x="0" dy="15">0xBB 0x2C 0xFF 0x44</tspan>
      <tspan x="0" dy="15">0x01 0xA3 0x9B 0x77</tspan>
      <tspan x="0" dy="15">0x22 0x48 0x6C 0xDE</tspan>
      <tspan x="0" dy="15">0x99 0x00 0x00 0x1A</tspan>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite" />
    </text>
  </g>

  <!-- Top / Bottom decorative frames -->
  <rect x="0" y="0" width="800" height="3" fill="#CCFF00" opacity="0.8" />
  <rect x="0" y="247" width="800" height="3" fill="#2B3BE5" opacity="0.5" />
  
  <!-- Sweeping Scanner Line -->
  <line x1="300" y1="0" x2="300" y2="250" stroke="#CCFF00" stroke-width="2" opacity="0.5" class="glow">
    <animate attributeName="x1" values="300;800;300" dur="4s" repeatCount="indefinite" />
    <animate attributeName="x2" values="300;800;300" dur="4s" repeatCount="indefinite" />
  </line>
</svg>
